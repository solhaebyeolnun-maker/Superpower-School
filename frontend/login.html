<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="assets/css/styles.css" />

<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header>
  <nav class="navbar">
    <div class="brand"><div class="logo">S</div><div>서울시 특이능력 영재학교</div></div>
    <div class="nav-links">
      <a href="index.html">홈</a>
      <a href="about.html">학교 소개</a>
      <a href="activities.html">교육 활동</a>

      <a href="lore.html">세계관 문서</a>
    </div>
  </nav>
</header>
<main id="main" class="layout">
  <section class="main">
    <section class="hero card">
      <div>
        <div class="badge">로그인</div>
        <h1>데모/서버 모드 선택</h1>
        <p class="muted">developer(admin): dev/dev1234 · NPC/게스트 계정 제공</p>
      </div>
      <div class="visual"><img src="https://files.catbox.moe/1gcvjl.PNG" alt="로그인" /></div>
    </section>
    <section class="card">
      <form id="login-form" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">
        <label>아이디<input name="id" required /></label>
        <label>비밀번호<input name="password" type="password" required /></label>
        <label>모드<select name="mode"><option value="demo">데모 (로컬)</option><option value="server">실서버</option></select></label>
        <button type="submit">로그인</button>
      </form>
    </section>
  </section>
</main>
<script type="module" src="assets/js/login.js"></script>
</body>
</html>
