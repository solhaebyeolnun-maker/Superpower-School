<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림마당 - 서울시 특이능력 영재학교</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">본문 바로가기</a>
<header>
  <nav class="navbar">
    <div class="brand"><div class="logo">S</div><div>서울시 특이능력 영재학교</div></div>
    <div class="nav-links">
      <a href="index.html">홈</a>
      <a href="about.html">학교 소개</a>
      <a href="activities.html">교육 활동</a>
      <a href="notice.html" class="active">알림마당</a>
      <a href="support.html">학습·지원</a>
      <a href="community.html">커뮤니티</a>
      <a href="lore.html">세계관 문서</a>
    </div>
    <div class="actions">
      <button class="button ghost" data-theme-toggle>다크모드</button>
      <a class="button" href="admin.html">관리자</a>
    </div>
  </nav>
</header>
<main id="main" class="layout">
  <aside class="sidebar">
    <div class="card">
      <div class="card-title">카테고리</div>
      <select id="notice-filter">
        <option value="">전체</option>
        <option value="안전">안전</option>
        <option value="훈련">훈련</option>
        <option value="생활">생활</option>
      </select>
      <input id="notice-search" placeholder="검색" />
    </div>
  </aside>
  <section class="main">
    <section class="hero card">
      <div>
        <div class="badge">공지사항/가정통신문</div>
        <h1>관리자 작성 + 자동 생성 템플릿</h1>
        <p class="muted">개발자(admin) 계정으로 로그인하면 작성/수정/삭제가 가능합니다.</p>
      </div>
      <div class="visual"><img src="https://files.catbox.moe/qpi9s2.png" alt="공지" /></div>
    </section>

    <section class="card">
      <table class="table" aria-label="공지 목록">
        <thead><tr><th>분류</th><th>제목</th><th>일자</th></tr></thead>
        <tbody id="notice-table"></tbody>
      </table>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-title">가정통신문</div>
        <p class="muted">온라인 확인/회신 UI. 로그인 사용자만 회신.</p>
        <button class="button ghost">예시 회신문 보기</button>
      </div>
      <div class="card">
        <div class="card-title">학교 소식</div>
        <p class="muted">행사 사진/보도자료</p>
        <div class="grid">
          <div class="card">뒤산 보호구역 봉인 점검</div>
          <div class="card">도심 야간 헌팅 실습</div>
        </div>
      </div>
    </section>
  </section>
</main>
<footer class="footer"><small>세계관 원문 기반 알림마당</small></footer>
<script type="module" src="assets/js/notice.js"></script>
</body>
</html>
